name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: devpilot
          POSTGRES_USER: devpilot
          POSTGRES_PASSWORD: devpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devpilot -d devpilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/devpilot
      POSTGRES_USER: devpilot
      POSTGRES_PASSWORD: devpilot
      # Dummy values: tests never call GitHub or OpenAI
      GITHUB_CLIENT_ID: ci
      GITHUB_CLIENT_SECRET: ci
      OPENAI_API_KEY: ci
      TOKEN_ENCRYPTOR_PASSWORD: ci-only-password
      TOKEN_ENCRYPTOR_SALT: deadbeefcafebabe
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Same mode as Vercel: proxy to the backend, same-origin API calls
      - run: npm run build
        env:
          BACKEND_URL: https://backend.example.com
