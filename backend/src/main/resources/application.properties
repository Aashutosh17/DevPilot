spring.application.name=backend

# Database (defaults target a local Postgres; overridden by env vars in Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/devpilot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devpilot}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devpilot}
spring.jpa.hibernate.ddl-auto=update

# Spring AI / OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:changeme}
