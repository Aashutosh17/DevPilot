
spring.application.name=backend

# Load secrets from the project-root .env file (git-ignored) when running locally.
# Both paths cover running from the project root (VS Code) or from backend/ (gradlew bootRun).
# In Docker there is no .env file; docker-compose passes the same values as environment variables.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/devpilot}
spring.datasource.username=${POSTGRES_USER:devpilot}
spring.datasource.password=${POSTGRES_PASSWORD:devpilot}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring AI / OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:changeme}
spring.ai.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id



# Session Cookie Configuration
server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# Trust X-Forwarded-* headers from the AWS load balancer so OAuth redirect URIs use https
server.forward-headers-strategy=framework

# App Settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Token Encryption
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT}

# Indexing Configuration
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100

# GitHub API
app.github.api-delay-ms=50