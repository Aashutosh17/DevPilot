
spring.application.name=backend
# Hosts like Render inject PORT
server.port=${PORT:8080}

# Load secrets from the project-root .env file (git-ignored) when running locally.
# Both paths cover running from the project root (VS Code) or from backend/ (gradlew bootRun).
# In Docker there is no .env file; docker-compose passes the same values as environment variables.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/devpilot}
spring.datasource.username=${POSTGRES_USER:devpilot}
spring.datasource.password=${POSTGRES_PASSWORD:devpilot}
# Small pool that can drop to zero idle connections, so a serverless DB (Neon) can sleep
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring AI (OpenAI-compatible API). Defaults target Google Gemini's free tier.
# The OpenAI Java SDK appends "/chat/completions" and "/embeddings" to the base URL as-is,
# so the base URL must include the version path. To use OpenAI instead, set:
#   OPENAI_BASE_URL=https://api.openai.com/v1
#   OPENAI_CHAT_MODEL=gpt-4o-mini
#   OPENAI_EMBEDDING_MODEL=text-embedding-3-small
# Re-index repos after changing the embedding model: vectors from different models can't be compared.
spring.ai.openai.api-key=${OPENAI_API_KEY:changeme}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.chat.model=${OPENAI_CHAT_MODEL:gemini-3.5-flash-lite}
spring.ai.openai.embedding.model=${OPENAI_EMBEDDING_MODEL:gemini-embedding-001}
# gemini-embedding-001 returns 3072 dims by default; ask for the size the vector table uses
spring.ai.openai.embedding.dimensions=${EMBEDDING_DIMENSIONS:1536}

# PgVector
spring.ai.vectorstore.pgvector.initialize-schema=true
# Must match the embedding size. HNSW indexes support at most 2000 dimensions.
spring.ai.vectorstore.pgvector.dimensions=${EMBEDDING_DIMENSIONS:1536}
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
# Demo deployments only index public repos, so they can ask for just read:user
spring.security.oauth2.client.registration.github.scope=${GITHUB_OAUTH_SCOPES:read:user,repo}
# Behind the Vercel proxy, GitHub must send users back to the frontend's domain
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
spring.security.oauth2.client.provider.github.user-name-attribute=id



# Session Cookie Configuration
server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d
# Set to true in production (HTTPS)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Trust X-Forwarded-* headers from the AWS load balancer so OAuth redirect URIs use https
server.forward-headers-strategy=framework

# App Settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Token Encryption
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT}

# Indexing Configuration
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100

# GitHub API
app.github.api-delay-ms=50

# Demo mode (portfolio deployment). See DEPLOY.md.
app.demo.enabled=${DEMO_MODE:false}
# Comma-separated GitHub usernames allowed to sync and index
app.demo.admin-github-usernames=${DEMO_ADMIN_GITHUB_USERNAMES:}
# Comma-separated owner/name of the preset repos visitors can chat with
app.demo.repos=${DEMO_REPOS:}
app.demo.max-messages-per-user=${DEMO_MAX_MESSAGES_PER_USER:20}
app.demo.max-messages-per-day=${DEMO_MAX_MESSAGES_PER_DAY:300}

# Health endpoint for the host's health check. Leave the DB out so checks don't keep it awake.
management.endpoints.web.exposure.include=health
management.health.db.enabled=false
