
spring.application.name=backend

# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/devpilot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devpilot}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devpilot}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring AI / OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:changeme}
spring.ai.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
