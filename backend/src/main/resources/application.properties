
spring.application.name=backend

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5434/devpilot 
spring.datasource.username=devpilot
spring.datasource.password=devpilot

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Spring AI / OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:changeme}
spring.ai.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# GitHub OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id



# Session Cookie Configuration
server.servlet.session.cookie.name=DEVPILOT_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# App Settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Token Encryption
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:devpilot-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}

# Indexing Configuration
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100

# GitHub API
app.github.api-delay-ms=50